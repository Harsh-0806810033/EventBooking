<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Book Seat</title>
    <meta charset="UTF-8"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="fragments :: header"></div>

<div class="container">

    <div class="card col-md-6 mx-auto mt-4 shadow-sm">
        <div class="card-body">

            <h5 class="mb-3">Book Seat</h5>

            <!-- Event Details -->
            <p><b>Event:</b> <span th:text="${event.name}"></span></p>
            <p><b>Description:</b> <span th:text="${event.description}"></span></p>
            <p><b>Date & Time:</b>
                <span th:text="${#temporals.format(event.eventDateTime, 'dd MMM yyyy HH:mm')}"></span>
            </p>
            <p><b>Location:</b> <span th:text="${event.location}"></span></p>
            <p><b>Available Seats:</b>
                <span th:text="${event.availableSeats}"></span>
            </p>

            <!-- Booking Form -->
            <form method="post"
                  th:action="@{/book}"
                  onsubmit="disableBookingButton(this)">


                <input type="hidden"
                       name="eventId"
                       th:value="${event.id}"/>

                <div class="mb-3">
                    <label class="form-label">Attendee Name</label>
                    <input class="form-control" name="name" required/>
                </div>

                <div class="mb-3">
                    <label class="form-label">Attendee Email (optional)</label>
                    <input class="form-control" type="email" name="email"/>
                </div>

                <div class="mb-3">
                    <label class="form-label">Phone Number (optional)</label>
                    <input class="form-control" type="tel" name="phoneNumber"/>
                </div>

                <button type="submit"
                        class="btn btn-success w-100"
                        id="bookingBtn">
                    Confirm Booking
                </button>
            </form>

            <a href="/events" class="btn btn-link mt-3">
                ← Back
            </a>

        </div>
    </div>

</div>

<!-- Disable button JS -->
<script>
function disableBookingButton(form) {
    const btn = form.querySelector("#bookingBtn");
    btn.disabled = true;
    btn.innerText = "Booking...";
}
</script>

</body>
</html>
