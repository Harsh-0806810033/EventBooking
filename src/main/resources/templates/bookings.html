<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Bookings</title>
    <meta charset="UTF-8"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<!-- Header -->
<div th:replace="fragments :: header"></div>

<div class="container">

    <!-- Page Title -->
    <h4 class="mt-4 mb-3">Seat Bookings</h4>

    <!-- Search / Filters -->
    <form method="get" action="/bookings" class="row g-2 mb-3">
        <div class="col-md-4">
            <input type="text"
                   name="keyword"
                   th:value="${keyword}"
                   class="form-control"
                   placeholder="Search by event or person name">
        </div>

        <div class="col-md-3">
            <input type="text"
                   name="email"
                   th:value="${email}"
                   class="form-control"
                   placeholder="Search by email">
        </div>

        <div class="col-md-2">
            <input type="number"
                   name="seatNumber"
                   th:value="${seatNumber}"
                   class="form-control"
                   placeholder="Seat No">
        </div>

        <div class="col-md-2">
            <button class="btn btn-primary w-100">Search</button>
        </div>

        <div class="col-md-1">
            <a href="/bookings" class="btn btn-outline-secondary w-100">Clear</a>
        </div>
    </form>

    <!-- Bookings Table -->
    <div class="card shadow-sm">
        <div class="card-body">

            <table class="table table-bordered table-hover align-middle">
                <thead class="table-dark">
                <tr>
                    <th>Event</th>
                    <th>Person Name</th>
                    <th>Email</th>
                    <th>Seat No</th>
                    <th>Booked On</th>
                    <th>Action</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="booking : ${bookings}">
                    <td th:text="${booking.event.name}"></td>
                    <td th:text="${booking.personName}"></td>
                    <td th:text="${booking.email}"></td>
                    <td th:text="${booking.seatNumber}"></td>
                    <td th:text="${#temporals.format(booking.createdAt,'dd MMM yyyy HH:mm')}"></td>

                    <td>
                        <form th:action="@{/booking/cancel/{id}(id=${booking.id})}"
                              method="post"
                              onsubmit="return confirm('Cancel this booking?');">
                            <input type="hidden"
                                   th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}" />
                            <button class="btn btn-danger btn-sm">
                                Cancel
                            </button>
                        </form>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(bookings)}">
                    <td colspan="6" class="text-center text-muted">
                        No bookings found
                    </td>
                </tr>
                </tbody>
            </table>

        </div>
    </div>

</div>

</body>
</html>
