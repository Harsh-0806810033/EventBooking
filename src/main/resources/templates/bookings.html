<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>All Bookings</title>
    <meta charset="UTF-8"/>

    <!-- ✅ REQUIRED for mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<!-- Header -->
<div th:replace="fragments :: header"></div>

<div class="container">

    <h4 class="mb-3">All Bookings</h4>

    <!-- Table Card -->
    <div class="card shadow-sm">
        <div class="card-body">

            <!-- ✅ Responsive table wrapper -->
            <div class="table-responsive">

                <table class="table table-bordered table-hover align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th>Event</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Seat</th>
                        <th>Booked On</th>
                        <th>Action</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="booking : ${bookings}">
                        <td th:text="${booking.event.name}"></td>
                        <td th:text="${booking.attendeeName}"></td>
                        <td th:text="${booking.attendeeEmail}"></td>
                        <td th:text="${booking.seatNumber}"></td>
                        <td th:text="${#temporals.format(
                                booking.bookingTime,'dd MMM yyyy HH:mm')}">
                        </td>

                        <!-- ✅ Stack buttons on mobile -->
                        <td class="d-flex flex-column flex-md-row gap-1">
                            <form th:action="@{/booking/cancel/{id}(id=${booking.id})}"
                                  method="post"
                                  onsubmit="return confirm('Cancel this booking?');">
                                <input type="hidden"
                                       th:name="${_csrf.parameterName}"
                                       th:value="${_csrf.token}" />

                                <button class="btn btn-danger btn-sm w-100">
                                    Cancel
                                </button>
                            </form>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(bookings)}">
                        <td colspan="6" class="text-center text-muted">
                            No bookings available
                        </td>
                    </tr>
                    </tbody>

                </table>
            </div>

        </div>
    </div>

    <a href="/events" class="btn btn-link mt-3">
        ← Back to Events
    </a>

</div>

<!-- ✅ REQUIRED Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
