<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Events</title>
    <meta charset="UTF-8"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Header -->
<div th:replace="~{fragments :: header}"></div>

<div class="container">

    <!-- Success/Error message -->
    <div th:if="${msg}" class="alert alert-success mt-3" th:text="${msg}"></div>
    <div th:if="${error}" class="alert alert-danger mt-3" th:text="${error}"></div>

    <!-- Create Event Card -->
    <div class="card shadow-sm mt-4 mb-4">
        <div class="card-body">
            <h5 class="card-title mb-3">Create New Event</h5>

            <form class="row g-3" method="post" th:action="@{/events}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="col-md-6">
                    <label class="form-label">Event Name</label>
                    <input type="text" class="form-control" name="name" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Event Description</label>
                    <textarea class="form-control" name="description" rows="2"></textarea>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Total Seats</label>
                    <input type="number" class="form-control" name="totalSeats" min="1" required>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Date & Time</label>
                    <input type="datetime-local" class="form-control" name="eventDateTime" required>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Location</label>
                    <input type="text" class="form-control" name="location" required>
                </div>

                <div class="col-12 d-flex justify-content-end">
                    <button class="btn btn-success">Create Event</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Events Table -->
    <div class="card shadow-sm">
        <div class="card-body">
            <h5 class="card-title mb-3">Available Events</h5>

            <table class="table table-bordered table-hover align-middle">
                <thead class="table-dark">
                <tr>
                    <th>Event Name</th>
                    <th>Description</th>
                    <th>Total Seats</th>
                    <th>Available</th>
                    <th>Date & Time</th>
                    <th>Location</th>
                    <th style="width: 280px;">Actions</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="event : ${events}">
                    <td th:text="${event.name}"></td>
                    <td th:text="${event.description}"></td>
                    <td th:text="${event.totalSeats}"></td>
                    <td>
                        <span th:text="${event.availableSeats}" 
                              th:classappend="${event.availableSeats == 0} ? 'text-danger fw-bold' : ''">
                        </span>
                    </td>
                    <td th:text="${#temporals.format(event.eventDateTime, 'dd MMM yyyy HH:mm')}"></td>
                    <td th:text="${event.location}"></td>

                    <td>
                        <!-- Book Seat -->
                        <a th:if="${event.availableSeats > 0}"
                           th:href="@{/book/{id}(id=${event.id})}"
                           class="btn btn-primary btn-sm">
                            Book
                        </a>

                        <span th:if="${event.availableSeats == 0}" class="badge bg-danger">Sold Out</span>

                        <!-- View Bookings -->
                        <a th:href="@{/events/{id}/bookings(id=${event.id})}"
                           class="btn btn-outline-secondary btn-sm ms-1">
                            View Seats
                        </a>

                        <!-- Delete Event -->
                        <form th:action="@{/events/delete/{id}(id=${event.id})}"
                              method="post"
                              style="display:inline-block; margin-left: 5px;"
                              onsubmit="return confirm('Are you sure you want to delete this event?');">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                        </form>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(events)}">
                    <td colspan="7" class="text-center text-muted">No events created yet</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Logout -->
    <form th:action="@{/logout}" method="post" class="mt-4">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button class="btn btn-outline-danger">Logout</button>
    </form>

</div>

</body>
</html>
