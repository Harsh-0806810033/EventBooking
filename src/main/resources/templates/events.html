<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Events</title>
    <meta charset="UTF-8"/>

    <!-- ✅ REQUIRED for mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<!-- Header -->
<div th:replace="fragments :: header"></div>

<div class="container">

    <!-- Alerts -->
    <div th:if="${msg}"
         class="alert alert-success mt-3"
         th:text="${msg}">
    </div>

    <div th:if="${error}"
         class="alert alert-danger mt-3"
         th:text="${error}">
    </div>

    <!-- Search Events -->
    <form method="get"
          action="/events"
          class="row g-2 mt-3 mb-3">

        <div class="col-12 col-md-8">
            <input type="text"
                   name="keyword"
                   th:value="${keyword}"
                   class="form-control"
                   placeholder="Search events by name or location">
        </div>

        <div class="col-6 col-md-2 d-grid">
            <button type="submit"
                    class="btn btn-primary">
                Search
            </button>
        </div>

        <div class="col-6 col-md-2 d-grid">
            <a href="/events"
               class="btn btn-outline-secondary">
                Clear
            </a>
        </div>
    </form>

    <div th:if="${keyword}"
         class="mb-3 text-muted">
        Showing results for
        "<strong th:text="${keyword}"></strong>"
    </div>

    <!-- Events Table -->
    <div class="card shadow-sm">
        <div class="card-body p-0">

            <!-- ✅ Prevent mobile overflow -->
            <div class="table-responsive">
                <table class="table table-bordered table-hover align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th>Event Name</th>
                        <th>Description</th>
                        <th>Total Seats</th>
                        <th>Available</th>
                        <th>Date & Time</th>
                        <th>Location</th>
                        <th>Actions</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="event : ${events}">
                        <td th:text="${event.name}"></td>
                        <td th:text="${event.description}"></td>
                        <td th:text="${event.totalSeats}"></td>
                        <td>
                            <span th:text="${event.availableSeats}"
                                  th:classappend="${event.availableSeats == 0}
                                      ? 'text-danger fw-bold' : ''">
                            </span>
                        </td>
                        <td th:text="${#temporals.format(
                                event.eventDateTime,'dd MMM yyyy HH:mm')}">
                        </td>
                        <td th:text="${event.location}"></td>

                        <td>
                            <div class="d-grid gap-1">

                                <!-- Book -->
                                <a th:if="${event.availableSeats > 0}"
                                   th:href="@{/book/{id}(id=${event.id})}"
                                   class="btn btn-primary btn-sm">
                                    Book
                                </a>

                                <span th:if="${event.availableSeats == 0}"
                                      class="badge bg-danger">
                                    Sold Out
                                </span>

                                <!-- View -->
                                <a th:href="@{/events/{id}/bookings(id=${event.id})}"
                                   class="btn btn-outline-secondary btn-sm">
                                    View Seats
                                </a>

                                <!-- Delete -->
                                <form th:action="@{/events/delete/{id}(id=${event.id})}"
                                      method="post"
                                      onsubmit="return confirm('Are you sure you want to delete this event?');">

                                    <button type="submit"
                                            class="btn btn-danger btn-sm">
                                        Delete
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(events)}">
                        <td colspan="7"
                            class="text-center text-muted py-3">
                            No events found
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

    <!-- Logout -->
    <form th:action="@{/logout}"
          method="post"
          class="mt-4 d-grid">
        <button class="btn btn-outline-danger">
            Logout
        </button>
    </form>

</div>

<!-- ✅ REQUIRED Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
