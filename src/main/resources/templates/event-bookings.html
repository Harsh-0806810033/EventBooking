<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Booked Seats</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments :: header}"></div>

<div class="container">
    <h2 class="mb-4">
        Booked Seats — <span th:text="${event.name}"></span>
    </h2>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>Seat #</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th> <!-- Added phone column -->
            <th>Action</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="booking : ${bookings}">
            <td th:text="${booking.seatNumber}"></td>
            <td th:text="${booking.attendeeName}"></td>
            <td th:text="${booking.attendeeEmail}"></td>
            <td th:text="${booking.attendeePhone}"></td> <!-- Display phone number -->
            <td>
                <form th:action="@{/booking/cancel/{id}(id=${booking.id})}"
                      method="post"
                      onsubmit="return confirm('Cancel this seat?');">

                    <button class="btn btn-danger btn-sm">
                        Cancel
                    </button>
                </form>
            </td>
        </tr>

        <tr th:if="${#lists.isEmpty(bookings)}">
            <td colspan="5" class="text-center text-muted">
                No bookings yet
            </td>
        </tr>
        </tbody>
    </table>

    <a href="/events" class="btn btn-secondary">Back</a>
</div>

</body>
</html>
