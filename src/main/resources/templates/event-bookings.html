<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Event Bookings</title>
    <meta charset="UTF-8"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<!-- Header -->
<div th:replace="fragments :: header"></div>

<div class="container">

    <!-- Event Title -->
    <h4 class="mt-4 mb-2"
        th:text="'Bookings for Event: ' + ${event.name}">
    </h4>

    <!-- Filters + Export -->
    <form method="get"
          th:action="@{/events/{id}/bookings(id=${event.id})}"
          class="row g-2 mb-3">

        <div class="col-md-4">
            <input type="text"
                   name="keyword"
                   th:value="${keyword}"
                   class="form-control"
                   placeholder="Search by person name">
        </div>

        <div class="col-md-3">
            <input type="text"
                   name="email"
                   th:value="${email}"
                   class="form-control"
                   placeholder="Search by email">
        </div>

        <div class="col-md-2">
            <input type="number"
                   name="seatNumber"
                   th:value="${seatNumber}"
                   class="form-control"
                   placeholder="Seat No">
        </div>

        <div class="col-md-2">
            <button class="btn btn-primary w-100">Filter</button>
        </div>

        <div class="col-md-1">
            <a th:href="@{/events/{id}/bookings(id=${event.id})}"
               class="btn btn-outline-secondary w-100">
                Clear
            </a>
        </div>
    </form>

    <!-- Export Button -->
    <div class="d-flex justify-content-end mb-2">
		<a th:href="@{/bookings/export(
		        eventId=${event.id},
		        keyword=${keyword},
		        email=${email},
		        seatNumber=${seatNumber})}"
		   class="btn btn-success btn-sm">
		    Export to Excel
		</a>
    </div>

    <!-- Bookings Table -->
    <div class="card shadow-sm">
        <div class="card-body">

            <table class="table table-bordered table-hover align-middle">
                <thead class="table-dark">
                <tr>
                    <th>Person Name</th>
                    <th>Email</th>
                    <th>Seat No</th>
                    <th>Booked On</th>
                    <th>Action</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="booking : ${bookings}">
                    <td th:text="${booking.attendeeName}"></td>
                    <td th:text="${booking.attendeeEmail}"></td>
                    <td th:text="${booking.seatNumber}"></td>
                    <td th:text="${#temporals.format(
                            booking.bookingTime,'dd MMM yyyy HH:mm')}">
                    </td>

                    <td>
						<form th:action="@{/booking/cancel/{id}(id=${booking.id})}"
						      method="post"
						      onsubmit="return confirm('Cancel this booking?');">

						    <!-- IMPORTANT: pass eventId -->
						    <input type="hidden"
						           name="eventId"
						           th:value="${event.id}" />

						    

						    <button class="btn btn-danger btn-sm">
						        Cancel
						    </button>
						</form>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(bookings)}">
                    <td colspan="5"
                        class="text-center text-muted">
                        No bookings found
                    </td>
                </tr>
                </tbody>

            </table>

        </div>
    </div>

    <a href="/events" class="btn btn-link mt-3">
        ← Back to Events
    </a>

</div>

</body>
</html>
