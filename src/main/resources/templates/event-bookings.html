<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Event Bookings</title>
    <meta charset="UTF-8"/>

    <!-- ✅ REQUIRED for mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<!-- Header -->
<div th:replace="fragments :: header"></div>

<div class="container">

    <!-- Event Title -->
    <h5 class="mt-3 mb-3 text-center text-md-start"
        th:text="'Bookings for Event: ' + ${event.name}">
    </h5>

    <!-- Filters -->
    <form method="get"
          th:action="@{/events/{id}/bookings(id=${event.id})}"
          class="row g-2 mb-3">

        <div class="col-12 col-md-4">
            <input type="text"
                   name="keyword"
                   th:value="${keyword}"
                   class="form-control"
                   placeholder="Search by person name">
        </div>

        <div class="col-12 col-md-3">
            <input type="text"
                   name="email"
                   th:value="${email}"
                   class="form-control"
                   placeholder="Search by email">
        </div>

        <div class="col-12 col-md-2">
            <input type="number"
                   name="seatNumber"
                   th:value="${seatNumber}"
                   class="form-control"
                   placeholder="Seat No">
        </div>

        <div class="col-6 col-md-2 d-grid">
            <button type="submit"
                    class="btn btn-primary">
                Filter
            </button>
        </div>

        <div class="col-6 col-md-1 d-grid">
            <a th:href="@{/events/{id}/bookings(id=${event.id})}"
               class="btn btn-outline-secondary">
                Clear
            </a>
        </div>
    </form>

    <!-- Export -->
    <div class="d-flex justify-content-end mb-2">
        <a th:href="@{/bookings/export(
                eventId=${event.id},
                keyword=${keyword},
                email=${email},
                seatNumber=${seatNumber})}"
           class="btn btn-success btn-sm w-100 w-md-auto">
            Export to Excel
        </a>
    </div>

    <!-- Table -->
    <div class="card shadow-sm">
        <div class="card-body p-0">

            <!-- ✅ Prevent mobile overflow -->
            <div class="table-responsive">
                <table class="table table-bordered table-hover align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th>Person Name</th>
                        <th>Email</th>
                        <th>Seat No</th>
                        <th>Booked On</th>
                        <th>Action</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="booking : ${bookings}">
                        <td th:text="${booking.attendeeName}"></td>
                        <td th:text="${booking.attendeeEmail}"></td>
                        <td th:text="${booking.seatNumber}"></td>
                        <td th:text="${#temporals.format(
                                booking.bookingTime,'dd MMM yyyy HH:mm')}">
                        </td>

                        <td>
                            <form th:action="@{/booking/cancel/{id}(id=${booking.id})}"
                                  method="post"
                                  onsubmit="return confirm('Cancel this booking?');">

                                <input type="hidden"
                                       name="eventId"
                                       th:value="${event.id}" />

                                <button type="submit"
                                        class="btn btn-danger btn-sm w-100">
                                    Cancel
                                </button>
                            </form>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(bookings)}">
                        <td colspan="5"
                            class="text-center text-muted py-3">
                            No bookings found
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

    <a href="/events"
       class="btn btn-link mt-3 w-100 text-center">
        ← Back to Events
    </a>

</div>

<!-- ✅ REQUIRED Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
