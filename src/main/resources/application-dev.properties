spring.datasource.url=jdbc:mysql://localhost:3306/eventmanagement?useSSL=false&serverTimezone=UTC
spring.datasource.username=admin
spring.datasource.password=Harsh0033
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

#spring.h2.console.enabled=true
#spring.h2.console.path=/h2-console

# ===============================
# CONNECTION POOL (SAFE FOR t2.micro)
# ===============================
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# ===============================
# THYMELEAF
# ===============================
spring.thymeleaf.cache=false

# ===============================
# MAIL (Gmail OR AWS SES)
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=test@gmail.com
spring.mail.password=xxxx 123 test test
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===============================
# LOGGING
# ===============================
logging.file.name=/home/ec2-user/app.log
logging.level.root=INFO


