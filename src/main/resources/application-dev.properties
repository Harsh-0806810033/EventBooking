spring.application.name=eventmanagement
# ===============================
# SERVER
# ===============================
server.port=8080
server.address=0.0.0.0

# ===============================
# DATABASE (H2 – FILE MODE)
# ===============================
#spring.datasource.url=jdbc:mysql://localhost:3306/seat_booking?useSSL=false&serverTimezone=UTC
#spring.datasource.username=root
