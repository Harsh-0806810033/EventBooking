version: "3.8"

services:
  mysql_db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_DATABASE: seat_booking
      MYSQL_USER: appuser
      MYSQL_PASSWORD: harsh0033
      MYSQL_ROOT_PASSWORD: harsh0033
      #MYSQL_PASSWORD_FILE: /run/secrets/app_db_password
      #MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
        # ✅ Bind Mount (Initialize SQL scripts from host)
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - event_network
    secrets:
      - app_db_password
      - mysql_root_password

  eventmanagement_app:
    build: .
    container_name: event_booking_app
    restart: always
    depends_on:
      - mysql_db
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql_db:3306/seat_booking
      SPRING_DATASOURCE_USERNAME: appuser
      SPRING_DATASOURCE_PASSWORD: harsh0033
      #SPRING_DATASOURCE_PASSWORD_FILE: /run/secrets/app_db_password
    secrets:
      - app_db_password
    networks:
      - event_network
    volumes:
      # ✅ Bind Mount (Logs stored on host machine)
      - ./app-logs:/logs

# ✅ Named Volume Definition
volumes:
  mysql_data:
    driver: local

secrets:
  app_db_password:
    file: ./secrets/app_db_password.txt
  mysql_root_password:
    file: ./secrets/mysql_root_password.txt

# ✅ Custom Network for Multi-Container Communication
networks:
  event_network:
    driver: bridge
